name: fourward_mobile
description: "4Ward - app do paciente para agendar e acompanhar consultas de fisioterapia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Chamadas HTTP para a API NestJS
  http: ^1.2.2
  # Guarda o token JWT de forma segura (Keystore/Keychain)
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
